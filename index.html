<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dye &amp; Pigment Recipe Explorer</title>
<style>
:root{--bg:#f5f3ee;--panel:#fffdf8;--ink:#23201b;--mute:#6f6a60;--line:#d9d3c5;--acc:#8a2f3c;--raw:#3f6b4a;--chip:#ece6d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1814;--panel:#23201b;--ink:#ece6d8;--mute:#9b9485;--line:#3a352c;--acc:#e08a96;--raw:#8cc79b;--chip:#2f2b23;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1814;--panel:#23201b;--ink:#ece6d8;--mute:#9b9485;--line:#3a352c;--acc:#e08a96;--raw:#8cc79b;--chip:#2f2b23;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Georgia,"Iowan Old Style",serif;display:grid;grid-template-columns:310px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:14px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel)}
main{padding:20px 24px;max-width:900px}
input{width:100%;padding:8px 10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;font:inherit}
.li{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:4px 6px;border-radius:4px;font:inherit;cursor:pointer}
.li:hover,.li.on{background:var(--chip)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}.tabs button{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:3px 9px;border-radius:6px 6px 0 0;font:inherit;font-size:.85em;cursor:pointer}.tabs button.on{background:var(--acc);border-color:var(--acc);color:var(--panel)}.tabs .q{margin-left:3px;color:inherit;opacity:.7}
.i{background:var(--chip);border:1px solid var(--line);color:var(--ink);padding:1px 8px;border-radius:12px;font:inherit;cursor:pointer;margin:1px}
.i:hover{border-color:var(--acc);color:var(--acc)}.i.raw{border-style:dashed;color:var(--raw)}
.q{color:var(--mute);font-size:.85em}
h1{margin:6px 0 2px;font-size:1.9em}h2{font-size:1.05em;margin:22px 0 6px;color:var(--mute);font-weight:normal;border-bottom:1px solid var(--line);padding-bottom:3px}
.r{padding:7px 10px;margin:5px 0;border-left:3px solid var(--acc);background:var(--panel)}
.st{font-style:italic;color:var(--mute);font-size:.85em;margin-right:8px}
.bc{font-size:.85em;color:var(--mute);margin-bottom:4px}.bc button{background:none;border:0;color:var(--mute);cursor:pointer;font:inherit;text-decoration:underline;padding:0}
details{margin-left:14px;border-left:1px dotted var(--line);padding-left:8px}summary{cursor:pointer;padding:2px 0}
.t{margin:2px 0 2px 14px;color:var(--mute);font-size:.9em}
.tools{display:flex;gap:6px;margin:8px 0}.tools button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 10px;border-radius:6px;cursor:pointer;font:inherit}
@media(max-width:700px){body{grid-template-columns:1fr}aside{position:static;height:220px;border-right:0;border-bottom:1px solid var(--line)}main{padding:14px}}
:root{--bg:#eceff4;--panel:#fff;--ink:#1c2033;--mute:#667088;--line:#d5dae5;--acc:#b23a48;--raw:#2f7a5b;--chip:#e4e8f1;--side:#1b2140;--sideink:#dfe4f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141d;--panel:#1b1e2b;--ink:#e6e9f5;--mute:#8d95ad;--line:#2d3246;--acc:#e8707d;--raw:#6fcf9f;--chip:#262a3b;--side:#0d0f17;--sideink:#cfd5ea}}
:root[data-theme="dark"]{--bg:#12141d;--panel:#1b1e2b;--ink:#e6e9f5;--mute:#8d95ad;--line:#2d3246;--acc:#e8707d;--raw:#6fcf9f;--chip:#262a3b;--side:#0d0f17;--sideink:#cfd5ea}
body{font:15px/1.55 "Avenir Next","Segoe UI",system-ui,sans-serif}
aside{background:var(--side);color:var(--sideink);border-right:0;padding:16px 14px}
aside input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:8px;padding:9px 12px}
aside input::placeholder{color:rgba(255,255,255,.5)}
.tabs{gap:5px;margin:12px 0 10px}
.tabs button{background:rgba(255,255,255,.07);border:1px solid transparent;color:var(--sideink);border-radius:999px;padding:3px 11px;font-size:.82em}
.tabs button:hover{background:rgba(255,255,255,.15)}
.tabs button.on{background:var(--acc);color:#fff}
.li{color:var(--sideink);border-radius:6px;padding:5px 8px;border-left:3px solid transparent}
.li:hover{background:rgba(255,255,255,.08)}
.li.on{background:rgba(255,255,255,.14);border-left-color:var(--acc);color:#fff}
main{padding:28px 32px 60px;max-width:920px}
h1{font:600 2.3em/1.15 Georgia,"Iowan Old Style",serif;letter-spacing:-.01em;margin:8px 0 4px}
h2{font:600 1.1em Georgia,serif;color:var(--ink);border:0;margin:30px 0 10px}
.bc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;display:inline-block}
.bc button{text-decoration:none;color:var(--acc)}
.r{--c:var(--acc);background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:10px 14px;margin:8px 0;box-shadow:0 1px 2px rgba(20,25,50,.06);line-height:2}
.s-Barrel{--c:#a07a3a}.s-CookingPot{--c:#d0652f}.s-Crafting{--c:#5b6fd6}.s-Pulverizer{--c:#6f8196}.s-Grindstone{--c:#8a72b0}
.st{font-style:normal;font-size:.75em;font-weight:600;background:var(--c);color:#fff;padding:2px 9px;border-radius:999px;margin-right:10px;vertical-align:1px}
.ar{color:var(--mute);margin:0 8px;font-weight:700}
.i{background:var(--chip);border:1px solid var(--line);padding:2px 11px;border-radius:999px;font:inherit;transition:background .12s,border-color .12s}
.i:hover{background:var(--panel);border-color:var(--acc);color:var(--acc)}
.i.raw{border-style:dashed;background:transparent}
.q{font-size:.8em}
details{border-left:2px solid var(--line);margin-left:16px;padding-left:12px}
summary{font-weight:600;padding:3px 0}
.t{margin:3px 0 3px 16px}
.t .st{font-size:.7em}
.sw{display:inline-block;width:.75em;height:.75em;border-radius:50%;margin-right:.45em;border:1px solid rgba(128,128,128,.5);vertical-align:-1px}
@media(max-width:700px){main{padding:18px 14px 50px}}
.of{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0}.of label{display:flex;flex-direction:column;font-size:.85em;color:var(--mute);gap:3px}.of select,.of input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;min-width:150px}
.ob{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:6px 14px;font:inherit;font-weight:600;cursor:pointer;margin-top:6px}.ob.big{width:100%;margin:0 0 10px;padding:9px}
.rc{display:inline-block;background:var(--chip);border-radius:6px;padding:0 8px;margin:2px 4px 2px 0;font-size:.9em;line-height:1.7}.vl{margin-right:10px}.r.sel{outline:2px solid var(--acc)}
textarea{width:100%;min-height:200px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:13px/1.5 ui-monospace,Menlo,monospace}
.sm{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 12px;font:inherit;cursor:pointer;float:right}.sm:hover{border-color:var(--acc);color:var(--acc)}
</style></head><body>
<aside><button class="ob big" data-o="">Order dye</button><input id="s" placeholder="Search items…" aria-label="Search items"><div class="tabs" id="tabs" role="tablist"></div><div id="list"></div></aside>
<main><div class="bc" id="bc"></div><div id="v"></div></main>
<script>
const D=`Dye|5L Water + Vermillion|5L Red Dye
Dye|2L Diluted Alum/2L Diluted Cassiterite/2L Diluted Chromite + Litharge/Cadmium Red/Powdered Hematite|2L Red Dye
Dye|3L Water + Cobalt Sulfate|3L Red Dye
Dye|5L Water + Crushed Lapis Lazuli|5L Blue Dye
Dye|2L Diluted Alum/2L Diluted Cassiterite/2L Diluted Chromite + Ultra Marine|2L Blue Dye
Dye|1L Green Dye + Onion|1L Lime Dye
Dye|10L Water + Rusty Gear/Rusty Scraps|10L Gray Dye
Dye|8L Diluted Alum/8L Diluted Cassiterite/8L Diluted Chromite + 1 Powdered Rusty Metal|8L Gray Dye
Dye|1L Water + Cranberry|1L Pink Dye
Dye|4L Water + Blue Lupine/Purple Lupine|4L Cyan Dye
Dye|1L Blue Dye/1L Woad Blue Dye + Dry Grass/Lily of the Valley|1L Teal Dye
Dye|2L Green Dye + 1 Powdered Borax|2L Mint Dye
Dye|10L Diluted Borax + 1 Powdered Borax|10L White Dye
Dye|2L Diluted Borax/2L Diluted Alum/2L Diluted Chromite + White Lead/Powdered Tin Oxide/Powdered Zinc Oxide|2L White Dye
Dye|1L Water + 4 Limonite/4 Walnut Seed/4 Fire Clay|1L Brown Dye
Dye|1L Red Dye + Dry Grass/Lily of the Valley|1L Brown Dye
Dye|2L Diluted Alum/2L Diluted Cassiterite/2L Diluted Chromite + Cobalt Green/Cadmium Green|2L Green Dye
Dye|1L Water + Onion/Heather|1L Yellow Dye
Dye|2L Diluted Alum/2L Diluted Cassiterite/2L Diluted Chromite + Cadmium Yellow/Crushed Limonite|2L Yellow Dye
Dye|1L Yellow Dye + Onion|1L Orange Dye
Dye|8L Yellow Dye + Vermillion/Powdered Iron Oxide|8L Orange Dye
Dye|2L Diluted Alum/2L Diluted Cassiterite/2L Diluted Chromite + Powdered Iron Oxide/Cadmium Orange|2L Orange Dye
Dye|1L Water + Black Currant/Blue Berry|1L Purple Dye
Dye|2L Blue Dye/2L Woad Blue Dye + 1 Vermillion|2L Purple Dye
Dye|2L Blue Dye/2L Woad Blue Dye + Powdered Borax|2L Sky Blue Dye
Dye|2L Purple Dye + Powdered Borax|2L Lavender Dye
Pulverizer|1 Cinnabar|1 Crushed Cinnabar
Grindstone|1 Crushed Cinnabar|2 Vermillion
Pulverizer|1 Alum|1 Crushed Alum
Pulverizer|1 Cassiterite|1 Crushed Cassiterite
Pulverizer|1 Chromite|1 Crushed Chromite
Grindstone|1 Crushed Chromite|2 Powdered Chromite
Pulverizer|1 Hematite|1 Crushed Hematite
Grindstone|1 Crushed Hematite|2 Powdered Hematite
Pulverizer|1 Galena|1 Crushed Galena
Grindstone|1 Crushed Galena|2 Powdered Galena
Pulverizer|1 Chalk Stone|1 Lime
Pulverizer|1 Lead|1 Crushed Lead
Grindstone|1 Crushed Lead|2 Powdered Lead
Pulverizer|1 Sphalerite|1 Crushed Sphalerite
Grindstone|1 Crushed Sphalerite|2 Powdered Sphalerite
Pulverizer|1 Iron|1 Crushed Iron
Grindstone|1 Crushed Iron|2 Powdered Iron
Pulverizer|1 Sulfur|1 Crushed Sulfur
Grindstone|1 Crushed Sulfur|2 Powdered Sulfur
Pulverizer|1 Pentlandite|1 Crushed Pentlandite
Grindstone|1 Crushed Pentlandite|2 Powdered Pentlandite
Pulverizer|1 Lapis Lazuli|1 Crushed Lapis Lazuli
Grindstone|1 Crushed Lapis Lazuli|2 Ultra Marine
Pulverizer|1 Rusty Scraps|1 Crushed Rusty Metal
Grindstone|1 Crushed Rusty Metal|2 Powdered Rusty Metal
Pulverizer|1 Borax|1 Crushed Borax
Grindstone|1 Crushed Borax|2 Powdered Borax
Pulverizer|1 Tin|1 Crushed Tin
Grindstone|1 Crushed Tin|2 Powdered Tin
Pulverizer|1 Cassiterite|1 Crushed Cassiterite
Grindstone|1 Crushed Cassiterite|2 Powdered Tin Oxide
Pulverizer|1 Zinc|1 Crushed Zinc
Grindstone|1 Crushed Zinc|2 Powdered Zinc
Pulverizer|1 Bauxite|1 Crushed Bauxite
Grindstone|1 Crushed Bauxite|2 Powdered Bauxite
Pulverizer|1 Sylvite|1 Crushed Sylvite
Grindstone|1 Crushed Sylvite|2 Powdered Sylvite
Pulverizer|1 Limonite|1 Crushed Limonite
Grindstone|1 Crushed Limonite|2 Powdered Limonite
Cooking Pot|1 Massicot|1 Litharge
Cooking Pot|1 Powdered Galena|1 Powdered Lead Oxide
Cooking Pot|0.2L Slaked Lime + 0.2L Weak Tannin + Compost + Powdered Lead|2 White Lead
Cooking Pot|2 Lime|1 Quicklime
Cooking Pot|1 Crushed Sphalerite + 1L Iron Sulfate|2 Cadmium Yellow
Cooking Pot|3 Powdered Iron + 1L Sulfuric Acid|1L Iron Sulfate
Cooking Pot|1L Water + 1 Saltpeter + 2 Powdered Sulfur|1L Sulfuric Acid
Cooking Pot|1L Cobalt Sulfate|1 Cobalt Sulfate
Cooking Pot|1 Powdered Tin|1 Powdered Tin Oxide
Cooking Pot|1 Powdered Sphalerite|1 Powdered Zinc
Cooking Pot|1 Powdered Zinc|1 Powdered Zinc Oxide
Cooking Pot|1L Cobalt Sulfate + 1 Crushed Chromite + 1 Crushed Bauxite + 1 Powdered Sylvite|3 Cobalt Green
Cooking Pot|1 Powdered Chromite|1 Viridian
Cooking Pot|1 Litharge/1 Powdered Lead Oxide/1 White Lead|1 Massicot
Barrel|5L Water + 1 Crushed Alum|5L Diluted Alum
Barrel|5L Water + 1 Crushed Cassiterite|5L Diluted Cassiterite
Barrel|5L Water + 1 Crushed Chromite|5L Diluted Chromite
Barrel|1L Water + 4 Quicklime|4L Slaked Lime
Barrel|1 Oak Bark + 10L Water|10L Weak Tannin
Barrel|1 Tanning Bark + 1L Water|1L Weak Tannin
Barrel|64 Rot|16 Compost
Barrel|8 Bark + 2L Water|1 Compost
Barrel|1L Sulfuric Acid + 1 Powdered Pentlandite|1L Cobalt Sulfate
Barrel|5L Water + 2 Powdered Borax|5L Diluted Borax
Barrel|0.5L Water + 1 Powdered Iron|1 Powdered Iron Oxide
Crafting|1 Powdered Sphalerite + 2 Cadmium Yellow|3 Cadmium Red
Crafting|1 Cadmium Yellow + 1 Viridian|1 Cadmium Green
Crafting|2 Cadmium Red + 1 Powdered Sphalerite|3 Cadmium Orange
Crafting|4 Cadmium Yellow + 5 Powdered Sphalerite|9 Cadmium Orange`;
const P=t=>{t=t.trim();const m=t.match(/^(\d*\.?\d+L?)\s+(.+)$/);return m?{q:m[1],n:m[2]}:{q:"",n:t}};
const R=[];
D.split("\n").forEach(l=>{const[s,i,o]=l.split("|");
 let combos=[[]];
 i.split(" + ").forEach(g=>{const alts=g.split("/").map(P);combos=combos.flatMap(c=>alts.map(a=>[...c,a]))});
 combos.forEach(c=>R.push({s,i:c,o:o.split(" + ").map(P)}))});
const made={},used={},all=new Set();
R.forEach((r,k)=>{r.o.forEach(x=>{(made[x.n]??=[]).push(k);all.add(x.n)});r.i.forEach(x=>{(used[x.n]??=[]).push(k);all.add(x.n)})});
const names=[...all].sort(),$=id=>document.getElementById(id);
const DC={Red:"#c0392b",Blue:"#2f5db3",Lime:"#a4d12f",Gray:"#8a8d93",Pink:"#f08fb0",Cyan:"#19b5c9",Teal:"#1e8c86",Mint:"#8fe3c0",White:"#f4f4f0",Brown:"#7a4b2a",Green:"#3a9a4a",Yellow:"#f0c928",Orange:"#ef8a1f",Purple:"#7b4bb3","Sky Blue":"#6cc3f2",Lavender:"#b9a4e6","Woad Blue":"#2a4a8a",Black:"#1b1b1b"};
const sw=n=>{const m=n.match(/^(.*) Dye$/),c=m&&DC[m[1]];return c?`<span class="sw" style="background:${c}"></span>`:""};
const chip=x=>`<button class="i${made[x.n]?"":" raw"}" data-n="${x.n}">${sw(x.n)}${x.n}</button>${x.q?` <span class="q">×${x.q}</span>`:""}`;
const recipe=(r,l)=>`<div class="r s-${r.s.replace(" ","")}">${l?`<b class="vl">${l}</b>`:`<span class="st">${r.s}</span>`}${r.i.map(chip).join(" + ")}<span class="ar">→</span>${r.o.map(chip).join(" + ")}</div>`;
const uniq=a=>[...new Set((a||[]).map(k=>JSON.stringify(R[k])))].map(s=>R.find(r=>JSON.stringify(r)===s));
function tree(n,path,d){
 if(!made[n])return`<div class="t">${chip({n,q:""})} <span class="q">raw resource</span></div>`;
 if(path.includes(n)||d>7)return`<div class="t">${n} <span class="q">(loop / depth limit)</span></div>`;
 const rs=uniq(made[n]);
 return`<details${d<2?" open":""}><summary>${sw(n)}${n} <span class="q">${rs.length>1?rs.length+" ways":rs[0].s}</span></summary>${rs.map(r=>`<div class="t s-${r.s.replace(" ","")}"><span class="st">${r.s}</span>${r.i.map(x=>tree(x.n,[...path,n],d+1)).join("")}</div>`).join("")}</details>`}
let hist=[],cur=null;
function go(n,push=true){if(push&&cur)hist.push(cur);cur=n;
 const m=uniq(made[n]),u=uniq(used[n]);
 $("bc").innerHTML=(hist.length?`<button data-back>← back</button> · `:"")+hist.slice(-4).map(h=>`<button data-n="${h}">${h}</button>`).join(" › ")+(hist.length?" › ":"")+cur;
 $("v").innerHTML=`<h1>${sw(n)}${n}</h1>${isDye(n)?`<button class="ob" data-o="${n}">Order this dye</button>`:""}<div class="q">${made[n]?"Craftable":"Raw resource (no recipe produces it)"} · used in ${u.length} recipe${u.length==1?"":"s"}</div>
 <h2>How to make it</h2>${m.length?m.map((r,i)=>recipe(r,isDye(n)?"Variant "+(i+1):"")).join(""):'<div class="q">Gathered or mined — start here.</div>'}
 <h2>What it's used for</h2>${u.length?u.map(recipe).join(""):'<div class="q">Not used as an ingredient in any listed recipe.</div>'}
 ${made[n]?`<h2>Full ingredient tree</h2>${tree(n,[],0)}`:""}`;
 if(!inTab(n,tab)){const t=TABS.findIndex((_,i)=>inTab(n,i));if(t>=0)tab=t}
 renderList();window.scrollTo(0,0)}
const TABS=[["Dyes","Dye"],["Barrel Recipes","Barrel"],["Cooking Recipes","Cooking Pot"],["Crafting Recipes","Crafting"],["Crushing","Pulverizer"],["Grinding","Grindstone"],["Raw Resource",null]];
let tab=0;
const inTab=(n,t)=>TABS[t][1]?(made[n]||[]).some(k=>R[k].s==TABS[t][1]):!made[n];
function renderList(){const q=$("s").value.toLowerCase();
 $("tabs").innerHTML=TABS.map((t,i)=>`<button role="tab" class="${i==tab?"on":""}" data-t="${i}">${t[0]}<span class="q">${names.filter(n=>inTab(n,i)).length}</span></button>`).join("");
 $("list").innerHTML=names.filter(n=>inTab(n,tab)&&n.toLowerCase().includes(q)).map(n=>`<button class="li${n==cur?" on":""}" data-n="${n}">${sw(n)}${n}</button>`).join("")}
document.addEventListener("click",e=>{const b=e.target.closest("[data-n],[data-back]");if(!b)return;
 if(b.hasAttribute("data-back")){const p=hist.pop();if(p)go(p,false)}else go(b.dataset.n)});
$("s").addEventListener("input",renderList);
$("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(b){tab=+b.dataset.t;renderList()}});
const isDye=n=>(made[n]||[]).some(k=>R[k].s=="Dye"),DYES=names.filter(isDye);
function needs(n,a,p){a=Math.round(a*1e6)/1e6;if(!made[n])return{[n]:a};if(p.includes(n))return null;
 for(const r of uniq(made[n])){const q=parseFloat(r.o.find(x=>x.n==n).q)||1,b=Math.ceil(a/q),t={};let ok=true;
  for(const x of r.i){const s=needs(x.n,b*(parseFloat(x.q)||1),[...p,n]);if(!s){ok=false;break}for(const k in s)t[k]=(t[k]||0)+s[k]}
  if(ok)return t}
 return null}
const rd=v=>Math.round(v*100)/100,fm=(k,v)=>rd(v)+(k=="Water"?" L":""),rt=r=>r.i.map(x=>(x.q?x.q+" ":"")+x.n).join(" + ")+" → "+r.o.map(x=>(x.q?x.q+" ":"")+x.n).join(" + ");
let OV=[],oamt=10;
function order(n){cur=null;$("bc").innerHTML="";renderList();
 $("v").innerHTML=`<h1>Order dye</h1><div class="q">Dye is made in whole batches, so partial batches round up. Sub-ingredients use the first recipe that works.</div><div class="of"><label>Dye<select id="od">${DYES.map(d=>`<option${d==n?" selected":""}>${d}</option>`).join("")}</select></label><label>Amount (L)<input id="oa" type="number" min="1" step="1" value="${oamt}"></label></div><div id="ov"></div><div id="oc"></div>`;ovar()}
function ovar(){const n=$("od").value,a=Math.max(1,Math.ceil(+$("oa").value||1));oamt=a;$("oc").innerHTML="";
 OV=uniq(made[n]).map(r=>{const out=parseFloat(r.o[0].q)||1,b=Math.ceil(a/out),t={};
  r.i.forEach(x=>{const s=needs(x.n,b*(parseFloat(x.q)||1),[n]);if(s)for(const k in s)t[k]=(t[k]||0)+s[k]});return{r,out,b,t,n,a}});
 $("ov").innerHTML=`<h2>${a} L ${sw(n)}${n}: pick a variant</h2>`+OV.map((v,i)=>`<div class="r s-Dye"><button class="sm" data-sel="${i}">Select</button><b class="vl">Variant ${i+1}</b><span class="q">${v.b} batch${v.b>1?"es":""} × ${v.out} L = ${v.b*v.out} L · ${rt(v.r)}</span><br>${Object.entries(v.t).map(([k,x])=>`<span class="rc">${k} <b>${fm(k,x)}</b></span>`).join("")}</div>`).join("")}
function pick(i){const v=OV[i],tot=v.b*v.out;document.querySelectorAll("#ov .r").forEach((e,j)=>e.classList.toggle("sel",j==i));
 const txt=[`Dye order: ${v.a} L ${v.n} (Variant ${i+1})`,`Recipe: ${rt(v.r)}`,`Batches: ${v.b} × ${v.out} L = ${tot} L`+(tot>v.a?` (${tot-v.a} L surplus)`:""),"","Resources needed:",...Object.entries(v.t).map(([k,x])=>`- ${k}: ${fm(k,x)}`)].join("\n");
 $("oc").innerHTML=`<h2>Your order: Variant ${i+1}</h2><button class="sm" data-copy>Copy</button><textarea id="ot" readonly>${txt}</textarea>`;$("oc").scrollIntoView({behavior:"smooth",block:"nearest"})}
